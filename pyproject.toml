[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinker-finetune"
version = "0.1.0"
description = "Extensive backend for fine-tuning fully open-weight LLMs with the Tinker API (LoRA / SFT / RL)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tinker-finetune contributors" }]
keywords = ["tinker", "fine-tuning", "lora", "llm", "qwen3", "llama", "rlhf", "sft"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "datasets>=2.18",
    "tenacity>=8.2",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
# The Tinker SDK is installed separately (see docs/setup.md). Kept optional so
# the backend, tests, and CI run without live API credentials.
tinker = ["tinker>=0.1"]
# Weights & Biases metrics logging (optional; enabled via TF_WANDB_PROJECT).
wandb = ["wandb>=0.16"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]

[project.scripts]
tinker-finetune = "tinker_finetune.cli:app"

[project.urls]
Homepage = "https://github.com/aabhimittal/tinker-api-fine-tuning-models"
Documentation = "https://github.com/aabhimittal/tinker-api-fine-tuning-models/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Typer/FastAPI depend on calls (Option/Query/Argument) in defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
