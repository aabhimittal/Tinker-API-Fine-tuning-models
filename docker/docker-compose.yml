services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tinker-finetune:latest
    ports:
      - "8000:8000"
    environment:
      # Set TF_DRY_RUN=false and provide TINKER_API_KEY for live training.
      TF_DRY_RUN: "true"
      TF_LOG_LEVEL: "INFO"
      TF_MAX_CONCURRENT_JOBS: "2"
      TINKER_API_KEY: "${TINKER_API_KEY:-}"
    volumes:
      - ../runs:/app/runs
      - ../examples:/app/examples:ro
    restart: unless-stopped
